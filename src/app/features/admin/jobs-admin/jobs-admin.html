<form [formGroup]="form" (ngSubmit)="onSubmit()" class="brand-card p-6 md:p-8 lg:p-10">
    <!-- Encabezado -->
    <div class="flex items-start justify-between gap-6 mb-10">
        <div>
            <span class="brand-number">
                {{ editingId() ? 'EDITAR' : 'NUEVA' }}
            </span>

            <h3 class="font-brand-serif text-2xl md:text-3xl mt-3">
                {{ editingId() ? 'Editar' : 'Nueva' }} Oferta
            </h3>

            <div class="brand-line mt-5"></div>
        </div>

        <button type="button" (click)="cancel()"
            class="w-9 h-9 border border-brand text-brand-muted hover:border-brand-gold hover:text-brand-gold transition-colors duration-300"
            aria-label="Cerrar formulario">
            <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 6l12 12M6 18L18 6" />
            </svg>
        </button>
    </div>

    <!-- Campos -->
    <div class="space-y-8">
        <!-- Título -->
        <div>
            <label for="job-title" class="block text-[10px] tracking-[0.25em] uppercase text-brand-muted mb-3">
                Título
            </label>

            <input id="job-title" formControlName="title" type="text" placeholder="Título de la oferta"
                class="brand-input" />
        </div>

        <!-- Descripción -->
        <div>
            <label for="job-description" class="block text-[10px] tracking-[0.25em] uppercase text-brand-muted mb-3">
                Descripción
            </label>

            <textarea id="job-description" formControlName="description"
                placeholder="Describe la posición y sus responsabilidades" rows="5" class="brand-textarea"></textarea>
        </div>

        <!-- Ubicación -->
        <div>
            <label for="job-location" class="block text-[10px] tracking-[0.25em] uppercase text-brand-muted mb-3">
                Ubicación
            </label>

            <input id="job-location" formControlName="location" type="text"
                placeholder="Ciudad, país o ubicación remota" class="brand-input" />
        </div>

        <!-- Modalidad -->
        <div>
            <label for="job-modality" class="block text-[10px] tracking-[0.25em] uppercase text-brand-muted mb-3">
                Modalidad
            </label>

            <select id="job-modality" formControlName="modality"
                class="w-full py-3 border-0 border-b border-brand bg-transparent text-brand-text outline-none focus:border-brand-gold transition-colors duration-200">
                <option value="REMOTO" class="bg-brand-dark">Remoto</option>

                <option value="HIBRIDO" class="bg-brand-dark">Híbrido</option>

                <option value="PRESENCIAL" class="bg-brand-dark">Presencial</option>
            </select>
        </div>
    </div>

    <!-- Acciones -->
    <div class="flex flex-col sm:flex-row gap-3 mt-10 pt-6 border-t border-brand">
        <button type="submit" class="brand-button-solid">Guardar</button>

        <button type="button" (click)="cancel()" class="brand-button">Cancelar</button>
    </div>
</form>
